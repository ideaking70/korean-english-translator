<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한영 번역창</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
*{box-sizing:border-box}
:root{
  --bg:#f5f3f4;
  --card:#ffffff;
  --text:#20254a;
  --muted:#6d7580;
  --border:#dce3e8;
  --primary:#252a5a;
  --blue:#66879a;
  --pink:#ff999e;
  --light-pink:#fde3e4;
  --soft-blue:#edf3f6;
}
html,body{margin:0;min-height:100%}
body{
  min-height:100vh;
  font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:linear-gradient(145deg,#f4f2f3 0%,#f8f7f7 48%,#eef2f4 100%);
  color:var(--text);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:34px 20px;
  letter-spacing:-.01em;
}
.container{
  width:min(980px,100%);
  background:var(--card);
  border:1px solid rgba(37,42,90,.08);
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 20px 55px rgba(37,42,90,.13),0 3px 10px rgba(37,42,90,.05);
}
.header{
  position:relative;
  padding:32px 34px 30px;
  color:#fff;
  background:var(--blue);
  overflow:hidden;
}
.header:after{
  content:"";
  position:absolute;
  right:-45px;
  top:-70px;
  width:190px;
  height:190px;
  border-radius:50%;
  background:rgba(255,255,255,.07);
}
.header-top{
  position:relative;
  z-index:1;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:18px;
}
.brand h1{
  margin:0;
  font-size:31px;
  line-height:1.15;
  font-weight:800;
  letter-spacing:-.05em;
}
.brand h1 .accent{color:var(--pink)}
.subtitle{
  margin-top:8px;
  color:rgba(255,255,255,.88);
  font-size:14px;
  font-weight:500;
}
.header-note{
  margin-top:16px;
  color:rgba(255,255,255,.78);
  font-size:12px;
  font-weight:500;
}
.reset-button{
  position:relative;
  z-index:2;
  flex-shrink:0;
  background:var(--pink);
  color:#fff;
  box-shadow:0 6px 14px rgba(37,42,90,.14);
}
.reset-button:hover{background:#ff858c}
.header-actions{display:flex;align-items:center;gap:10px}
.site-language{display:flex;align-items:center;background:#ffffff;border:1px solid #d8dbea;border-radius:12px;padding:3px;box-shadow:0 5px 14px rgba(37,42,90,.08)}
.site-language-button{min-height:34px;padding:0 11px;border:0;border-radius:9px;background:transparent;color:#252a5a;font-weight:700;font-size:12px;cursor:pointer;transition:all .18s ease}
.site-language-button.active{background:#252a5a;color:#ffffff}
.site-language-button:hover{background:#eef0f8}
.site-language-button.active:hover{background:#252a5a}
.main{padding:30px 34px 26px}
.label-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:0 0 9px;
}
.label{
  font-size:13px;
  font-weight:800;
  color:var(--text);
}
.counter{
  color:#8b929a;
  font-size:12px;
  font-weight:600;
}
textarea{
  display:block;
  width:100%;
  min-height:205px;
  height:205px;
  overflow-y:auto;
  resize:vertical;
  border:1px solid var(--border);
  border-radius:17px;
  padding:18px 19px;
  font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:17px;
  font-weight:400;
  line-height:1.72;
  letter-spacing:-.01em;
  color:var(--text);
  background:#fff;
  outline:none;
  transition:border-color .18s ease,box-shadow .18s ease,background .18s ease;
}
textarea::placeholder{color:#adb4bb}
textarea:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 4px rgba(102,135,154,.13);
}
textarea[readonly]{
  background:#f8fafb;
  cursor:text;
}
.output-display{
  display:block;
  width:100%;
  min-height:205px;
  height:205px;
  overflow-y:auto;
  resize:vertical;
  border:1px solid var(--border);
  border-radius:17px;
  padding:18px 19px;
  font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:17px;
  font-weight:500;
  line-height:1.72;
  letter-spacing:-.01em;
  color:var(--text);
  background:linear-gradient(180deg,#f9fbfc 0%,#fff 100%);
  outline:none;
  white-space:pre-wrap;
  word-break:break-word;
  overflow-wrap:anywhere;
  scrollbar-gutter:stable;
}
.output-display:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 4px rgba(102,135,154,.13);
}
.output-display.empty{color:#adb4bb}
.output-chat{
  display:block;
  font-weight:600;
  color:var(--text);
}
.output-full{
  display:block;
  margin-top:2px;
  color:#7b838d;
  font-size:.88em;
  font-weight:450;
}
.input-box textarea{
  font-weight:500;
  background:linear-gradient(180deg,#fff 0%,#fff 72%,#fffafb 100%);
}
.output-box textarea{
  font-weight:500;
  background:linear-gradient(180deg,#f9fbfc 0%,#fff 100%);
}
.controls{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin:13px 0 27px;
}
.hint{
  color:#8a9198;
  font-size:12px;
  font-weight:500;
  line-height:1.5;
}
.button-group{
  display:flex;
  gap:8px;
  flex-shrink:0;
}
button{
  border:0;
  border-radius:11px;
  min-height:41px;
  padding:0 17px;
  font-family:inherit;
  font-size:13px;
  font-weight:700;
  letter-spacing:-.01em;
  cursor:pointer;
  transition:background .16s ease,transform .08s ease,opacity .16s ease,box-shadow .16s ease;
}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed}
.reset-button:hover{box-shadow:0 8px 18px rgba(37,42,90,.16)}
.copy{
  background:var(--soft-blue);
  color:var(--text);
}
.copy:hover{background:#e2edf2}
.result-actions{
  display:flex;
  justify-content:flex-end;
  margin-top:10px;
}
.copy{
  min-height:36px;
  padding:0 14px;
  font-size:12px;
}
.status{
  min-height:19px;
  margin-top:9px;
  padding-left:2px;
  color:#9299a1;
  font-size:12px;
  font-weight:500;
}
.error{color:#b42318}
.tip{
  margin-top:24px;
  padding:13px 16px;
  border-radius:14px;
  background:var(--light-pink);
  color:var(--text);
  display:flex;
  align-items:center;
  gap:10px;
  font-size:12px;
  font-weight:600;
}
.tip-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:38px;
  height:25px;
  padding:0 8px;
  border-radius:999px;
  background:var(--pink);
  color:#fff;
  font-size:11px;
  font-weight:800;
}
.tip-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--blue);
  flex-shrink:0;
}
@media(min-width:760px){
  .translation-grid{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    gap:22px;
    align-items:start;
  }
  .controls{
    grid-column:1 / -1;
    margin-top:-4px;
    margin-bottom:0;
  }
}
@media(max-width:759px){
  .main{padding:25px 20px 22px}
  .translation-grid{display:block}
  .output-box{margin-top:24px}
}
@media(max-width:700px){
  body{padding:14px;align-items:flex-start}
  .container{width:100%;margin-top:8px;border-radius:19px}
  .header{padding:25px 20px 23px}
  .brand h1{font-size:25px}
  .subtitle{font-size:12px}
  .header-note{font-size:11px}
  .main{padding:22px 18px 19px}
  .header-actions{width:100%;justify-content:flex-start;flex-wrap:wrap}
  textarea{min-height:160px;font-size:16px;padding:15px}
  .output-display{min-height:160px;font-size:16px;padding:15px}
  .controls{
    align-items:stretch;
    flex-direction:column;
    margin-bottom:0;
  }
  .hint{text-align:center;order:2}
  .button-group{width:100%;order:1}
  .button-group button{flex:1;width:50%}
  .result-actions{justify-content:stretch}
  .copy{width:100%}
  .tip{align-items:flex-start;flex-wrap:wrap}
}
@media(max-width:430px){
  body{padding:8px}
  .header{padding:21px 16px}
  .main{padding:19px 14px 17px}
  .header-top{gap:10px}
  .brand h1{font-size:22px}
  .subtitle{font-size:11px}
  .reset-button{min-height:37px;padding:0 12px;font-size:12px}
  textarea{min-height:145px}
  .output-display{min-height:145px}
  .button-group{gap:6px}
  button{padding:0 12px}
}
</style>

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#243b5a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="한영 번역창">
<link rel="apple-touch-icon" href="./icon-192.png">

</head>

<body>
<div class="container">

    <header class="header">
        <div class="header-top">
            <div class="brand">
                <h1 id="siteTitle"><span class="accent">한영</span> 번역창</h1>
                <div class="subtitle" id="siteSubtitle">한국어 ↔ English · 자연스러운 구어체</div>
                <div class="header-note" id="siteNote">자연스럽게 쓰고, 편하게 번역하세요.</div>
            </div>

            <div class="header-actions">
                <div class="site-language" role="group" aria-label="사이트 언어 선택">
                    <button id="siteKorean" class="site-language-button active" type="button" aria-pressed="true">한국어</button>
                    <button id="siteEnglish" class="site-language-button" type="button" aria-pressed="false">English</button>
                </div>
                <button id="reset" type="button" class="reset-button">
                    전체 초기화
                </button>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="translation-grid">

            <section class="input-box">
                <div class="label-row">
                    <span class="label" id="inputLabel">한국어 / English 입력</span>
                    <span class="counter" id="counter">0 / 5,000</span>
                </div>

                <textarea
                    id="input"
                    placeholder="한국어나 영어를 편하게 입력해 주세요."
                    spellcheck="false"
                    autocomplete="off"
                    maxlength="5000"
                ></textarea>

                <div class="result-actions">
                    <button class="copy" id="copyInput" type="button">
                        <span id="copyInputText">입력 복사</span>
                    </button>
                </div>
            </section>

            <section class="output-box">
                <div class="label-row">
                    <span class="label" id="outputLabel">번역 결과</span>
                </div>

                <div
                    id="output"
                    class="output-display empty"
                    role="status"
                    aria-live="polite"
                    aria-label="번역 결과"
                    tabindex="0"
                ><span class="output-placeholder" id="outputPlaceholder">번역 결과가 여기에 표시됩니다.</span></div>

                <div class="result-actions">
                    <button class="copy" id="copy" type="button">
                        <span id="copyText">결과 복사</span>
                    </button>
                </div>

                <div class="status" id="status" aria-live="polite"></div>
            </section>

            <div class="controls">
                <div class="hint">
                    <span id="hintText">입력을 멈추면 자동 번역&nbsp;&nbsp;·&nbsp;&nbsp;Enter = 번역&nbsp;&nbsp;·&nbsp;&nbsp;Alt + Enter = 줄바꿈</span>
                </div>
            </div>

        </div>

        <div class="tip">
            <span class="tip-dot"></span>
            <span class="tip-badge">TIP</span>
            <span id="tipText">한국어는 자연스러운 영어 구어체로, 영어는 편안한 해요체로 번역해요.</span>
        </div>
    </main>

</div>
<script>
"use strict";

const input = document.getElementById("input");
const output = document.getElementById("output");
const status = document.getElementById("status");
const copyButton = document.getElementById("copy");
const copyInput = document.getElementById("copyInput");
const resetButton = document.getElementById("reset");
const counter = document.getElementById("counter");
const inputLabel = document.getElementById("inputLabel");
const siteKoreanButton = document.getElementById("siteKorean");
const siteEnglishButton = document.getElementById("siteEnglish");
const siteTitle = document.getElementById("siteTitle");
const siteSubtitle = document.getElementById("siteSubtitle");
const siteNote = document.getElementById("siteNote");
const outputLabel = document.getElementById("outputLabel");
const copyInputText = document.getElementById("copyInputText");
const copyTextLabel = document.getElementById("copyText");
const hintText = document.getElementById("hintText");
const tipText = document.getElementById("tipText");

function updateCounter() {
    counter.textContent = input.value.length.toLocaleString() + " / 5,000";
}


let isTranslating = false;
let lastTranslatedText = "";
let translationTimer = null;
let translationController = null;
let translationRequestId = 0;
const AUTO_TRANSLATE_DELAY = 200;
let siteLanguage = localStorage.getItem("translatorSiteLanguage") || "ko";

function containsKorean(text) {
    return /[가-힣]/.test(text);
}

function getOutputText() {
    return output.dataset.copyText || "";
}

function clearOutput() {
    output.dataset.copyText = "";
    output.classList.add("empty");
    output.innerHTML = "<span class=\"output-placeholder\" id=\"outputPlaceholder\"></span>";
    output.querySelector(".output-placeholder").textContent = UI_TEXT[siteLanguage].outputPlaceholder;
}

function renderEnglishLearningResult(chat, full) {
    const cleanChat = decodeHtmlEntities(chat).trim();
    const cleanFull = decodeHtmlEntities(full).trim();
    output.dataset.copyText = cleanChat + (cleanFull && cleanFull !== cleanChat ? "\n(" + cleanFull + ")" : "");
    output.classList.remove("empty");
    output.innerHTML = "";
    const chatSpan = document.createElement("span");
    chatSpan.className = "output-chat";
    chatSpan.textContent = cleanChat;
    output.appendChild(chatSpan);
    if (cleanFull && cleanFull !== cleanChat) {
        const fullSpan = document.createElement("span");
        fullSpan.className = "output-full";
        fullSpan.textContent = "(" + cleanFull + ")";
        output.appendChild(fullSpan);
    }
}

function renderKoreanResult(text) {
    const clean = decodeHtmlEntities(text).trim();
    output.dataset.copyText = clean;
    output.classList.toggle("empty", !clean);
    output.innerHTML = "";
    if (clean) {
        const span = document.createElement("span");
        span.className = "output-chat";
        span.textContent = clean;
        output.appendChild(span);
    } else {
        const placeholder = document.createElement("span");
        placeholder.className = "output-placeholder";
        placeholder.textContent = UI_TEXT[siteLanguage].outputPlaceholder;
        output.appendChild(placeholder);
    }
}


function decodeHtmlEntities(text) {
    const el = document.createElement("textarea");
    let decoded = String(text);

    // 번역 API가 &amp;nbsp;처럼 HTML 엔티티를 여러 겹으로
    // 이스케이프해서 보내는 경우를 최대 3번까지 정상적인 문자로 복원해요.
    for (let i = 0; i < 3; i++) {
        el.innerHTML = decoded;
        const next = el.value;
        if (next === decoded) break;
        decoded = next;
    }

    return decoded
        .replace(/\u00A0/g, " ")
        .replace(/[ \t]+\n/g, "\n")
        .trim();
}

function makeConversationalEnglish(text) {
    return text
        .replace(/\bright now\b/gi, "rn")
        .replace(/\bby the way\b/gi, "btw")
        .replace(/\bi don't know\b/gi, "idk")
        .replace(/\bi do not know\b/gi, "idk")
        .replace(/\bi don't care\b/gi, "idc")
        .replace(/\bi do not care\b/gi, "idc")
        .replace(/\bwant to\b/gi, "wanna")
        .replace(/\bgoing to\b/gi, "gonna")
        .replace(/\bgot to\b/gi, "gotta")
        .replace(/\blet me\b/gi, "lemme")
        .replace(/\bgive me\b/gi, "gimme")
        .replace(/\bkind of\b/gi, "kinda")
        .replace(/\bbecause\b/gi, "cuz")
        .replace(/\bthough\b/gi, "tho")
        .replace(/\bI am\b/g, "I'm")
        .replace(/\bI will\b/g, "I'll")
        .replace(/\bI have\b/g, "I've")
        .replace(/\bI would\b/g, "I'd")
        .replace(/\bI cannot\b/gi, "I can't")
        .replace(/\bcannot\b/gi, "can't")
        .replace(/\bdo not\b/gi, "don't")
        .replace(/\bdoes not\b/gi, "doesn't")
        .replace(/\bdid not\b/gi, "didn't")
        .replace(/\bwill not\b/gi, "won't")
        .replace(/\bwould not\b/gi, "wouldn't")
        .replace(/\bshould not\b/gi, "shouldn't")
        .replace(/\bit is\b/gi, "it's")
        .replace(/\bthat is\b/gi, "that's")
        .replace(/\byou are\b/gi, "u r")
        .replace(/\byou're\b/gi, "ur")
        .replace(/\byour\b/gi, "ur")
        .replace(/\byou\b/gi, "u")
        .replace(/\bare\b/gi, "r")
        .replace(/\bto\b/gi, "2")
        .replace(/\bfor\b/gi, "4");
}

function makeFullEnglish(text) {
    return text
        .replace(/\b2nite\b/gi, "tonight")
        .replace(/\brn\b/gi, "right now")
        .replace(/\bbtw\b/gi, "by the way")
        .replace(/\bidk\b/gi, "I don't know")
        .replace(/\bidc\b/gi, "I don't care")
        .replace(/\bwanna\b/gi, "want to")
        .replace(/\bgonna\b/gi, "going to")
        .replace(/\bgotta\b/gi, "got to")
        .replace(/\blemme\b/gi, "let me")
        .replace(/\bgimme\b/gi, "give me")
        .replace(/\bkinda\b/gi, "kind of")
        .replace(/\bcuz\b/gi, "because")
        .replace(/\btho\b/gi, "though")
        .replace(/\bur\b/gi, "your")
        .replace(/\bu r\b/gi, "you are")
        .replace(/\bu\b/gi, "you")
        .replace(/\br\b/gi, "are")
        .replace(/\b2\b/g, "to")
        .replace(/\b4\b/g, "for")
        .replace(/\bI'm\b/gi, "I am")
        .replace(/\bI've\b/gi, "I have")
        .replace(/\bI'll\b/gi, "I will")
        .replace(/\bI'd\b/gi, "I would")
        .replace(/\byou're\b/gi, "you are")
        .replace(/\byou've\b/gi, "you have")
        .replace(/\byou'll\b/gi, "you will")
        .replace(/\byou'd\b/gi, "you would")
        .replace(/\bhe's\b/gi, "he is")
        .replace(/\bshe's\b/gi, "she is")
        .replace(/\bwe're\b/gi, "we are")
        .replace(/\bwe've\b/gi, "we have")
        .replace(/\bthey're\b/gi, "they are")
        .replace(/\bthey've\b/gi, "they have")
        .replace(/\bcan't\b/gi, "cannot")
        .replace(/\bdon't\b/gi, "do not")
        .replace(/\bdoesn't\b/gi, "does not")
        .replace(/\bdidn't\b/gi, "did not")
        .replace(/\bwon't\b/gi, "will not")
        .replace(/\bwouldn't\b/gi, "would not")
        .replace(/\bshouldn't\b/gi, "should not")
        .replace(/\bit's\b/gi, "it is")
        .replace(/\bthat's\b/gi, "that is")
        .replace(/\bur\b/gi, "your");
}

function makeConversationalKorean(text) {
    // 단어 내부를 잘못 건드리지 않도록 문장 끝의 대표적인 합쇼체 표현만 바꿔요.
    return text
        .replace(/하셨습니다([.!?]?)/g, "하셨어요$1")
        .replace(/하였습니다([.!?]?)/g, "했어요$1")
        .replace(/부탁드립니다([.!?]?)/g, "부탁드릴게요$1")
        .replace(/감사합니다([.!?]?)/g, "고마워요$1")
        .replace(/죄송합니다([.!?]?)/g, "미안해요$1")
        .replace(/알겠습니다([.!?]?)/g, "알겠어요$1")
        .replace(/모르겠습니다([.!?]?)/g, "모르겠어요$1")
        .replace(/하십시오([.!?]?)/g, "하세요$1")
        .replace(/하십니다([.!?]?)/g, "하세요$1")
        .replace(/가능합니다([.!?]?)/g, "가능해요$1")
        .replace(/필요합니다([.!?]?)/g, "필요해요$1")
        .replace(/바랍니다([.!?]?)/g, "바랄게요$1")
        .replace(/됩니다([.!?]?)/g, "돼요$1")
        .replace(/됐습니다([.!?]?)/g, "됐어요$1")
        .replace(/되었습니다([.!?]?)/g, "됐어요$1")
        .replace(/있습니다([.!?]?)/g, "있어요$1")
        .replace(/없습니다([.!?]?)/g, "없어요$1")
        .replace(/아닙니다([.!?]?)/g, "아니에요$1")
        .replace(/합니다([.!?]?)/g, "해요$1")
        .replace(/했습니다([.!?]?)/g, "했어요$1")
        .replace(/하시겠습니까\?/g, "하실래요?")
        .replace(/습니까\?/g, "어요?");
}

function setStatus(message, isError = false) {
    status.textContent = message;
    status.classList.toggle("error", isError);
}

function splitTextForTranslation(text, maxChars = 450) {
    if (text.length <= maxChars) return [text];

    const chunks = [];
    let remaining = text;

    while (remaining.length > maxChars) {
        const candidate = remaining.slice(0, maxChars);
        const breakPatterns = [
            /\n+/g,
            /[.!?。！？]\s*/g,
            /[,，;；:：]\s*/g,
            /\s+/g
        ];

        let cut = -1;
        for (const pattern of breakPatterns) {
            let match;
            while ((match = pattern.exec(candidate)) !== null) {
                cut = match.index + match[0].length;
            }
            if (cut > maxChars * 0.55) break;
        }

        if (cut <= 0 || cut > maxChars) cut = maxChars;
        const chunk = remaining.slice(0, cut).trim();
        if (chunk) chunks.push(chunk);
        remaining = remaining.slice(cut).trimStart();
    }

    if (remaining.trim()) chunks.push(remaining.trim());
    return chunks;
}

async function translateChunk(text, source, target, signal) {
    // 1) Google 공개 번역 엔드포인트
    // 2) MyMemory
    // 3) LibreTranslate 공개 Argos Translate 인스턴스
    // 앞 단계가 실패할 때만 다음 단계로 넘어갑니다.
    const googleUrl =
        "https://translate.googleapis.com/translate_a/single" +
        "?client=gtx" +
        "&sl=" + encodeURIComponent(source) +
        "&tl=" + encodeURIComponent(target) +
        "&dt=t" +
        "&q=" + encodeURIComponent(text);

    try {
        const response = await fetch(googleUrl, { signal });
        if (!response.ok) throw new Error("Google HTTP " + response.status);
        const data = await response.json();
        if (Array.isArray(data?.[0])) {
            const result = data[0]
                .filter(part => Array.isArray(part) && typeof part[0] === "string")
                .map(part => part[0])
                .join("");
            if (result.trim()) return decodeHtmlEntities(result);
        }
    } catch (error) {
        if (error?.name === "AbortError") throw error;
    }

    // MyMemory fallback
    try {
        const url =
            "https://api.mymemory.translated.net/get?q=" +
            encodeURIComponent(text) +
            "&langpair=" + source + "|" + target;
        const response = await fetch(url, {
            method: "GET",
            headers: { "Accept": "application/json" },
            signal
        });
        if (!response.ok) throw new Error("MyMemory HTTP " + response.status);
        const data = await response.json();
        const result = data?.responseData?.translatedText || "";
        if (/QUERY LENGTH LIMIT|MAX ALLOWED QUERY|INVALID QUERY/i.test(result)) {
            throw new Error("MyMemory query limit");
        }
        if (result.trim()) return decodeHtmlEntities(result);
    } catch (error) {
        if (error?.name === "AbortError") throw error;
    }

    // LibreTranslate / Argos Translate fallback.
    // 공개 인스턴스는 운영 상태나 CORS 정책이 바뀔 수 있으므로 실패하면 조용히 다음 처리로 넘어갑니다.
    const libreEndpoints = [
        "https://translate.argosopentech.com/translate",
        "https://libretranslate.de/translate"
    ];

    for (const endpoint of libreEndpoints) {
        try {
            const response = await fetch(endpoint, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Accept": "application/json" },
                body: JSON.stringify({ q: text, source, target, format: "text" }),
                signal
            });
            if (!response.ok) throw new Error("LibreTranslate HTTP " + response.status);
            const data = await response.json();
            const result = data?.translatedText || "";
            if (result.trim()) return decodeHtmlEntities(result);
        } catch (error) {
            if (error?.name === "AbortError") throw error;
        }
    }

    throw new Error("번역 서버에 연결하지 못했습니다.");
}
async function translateChunks(chunks, source, target, signal, requestId) {
    const results = new Array(chunks.length);
    let nextIndex = 0;
    const workerCount = Math.min(3, chunks.length);

    async function worker() {
        while (true) {
            if (requestId !== translationRequestId) return;
            const index = nextIndex++;
            if (index >= chunks.length) return;

            results[index] = await translateChunk(chunks[index], source, target, signal);

            if (requestId === translationRequestId && chunks.length > 1) {
                const done = results.filter(Boolean).length;
                setStatus(UI_TEXT[siteLanguage].translatingProgress + Math.round((done / chunks.length) * 100) + "%");
            }
        }
    }

    await Promise.all(Array.from({ length: workerCount }, () => worker()));
    return results;
}

async function translate() {
    const text = input.value.trim();

    if (!text) {
        clearOutput();
        setStatus("");
        return;
    }

    if (text === lastTranslatedText && !isTranslating) {
        return;
    }

    if (translationController) {
        translationController.abort();
    }

    translationController = new AbortController();
    const controller = translationController;
    const requestId = ++translationRequestId;

    if (translationTimer) {
        clearTimeout(translationTimer);
        translationTimer = null;
    }

    const source = containsKorean(text) ? "ko" : "en";
    const target = source === "ko" ? "en" : "ko";
    const chunks = splitTextForTranslation(text, 450);

    isTranslating = true;
    setStatus(
        chunks.length > 1
            ? UI_TEXT[siteLanguage].translatingLong
            : UI_TEXT[siteLanguage].translating
    );

    try {
        if (requestId !== translationRequestId || input.value.trim() !== text) {
            return;
        }

        const translatedChunks = await translateChunks(
            chunks,
            source,
            target,
            controller.signal,
            requestId
        );

        if (
            requestId !== translationRequestId ||
            input.value.trim() !== text
        ) {
            return;
        }

        // 분할 번역 결과를 원문의 문단 구조에 맞춰 연결
        let result = translatedChunks.join("\n");

        result = decodeHtmlEntities(result);

        if (source === "ko") {
            const full = makeFullEnglish(result);
            const chat = makeConversationalEnglish(full);
            renderEnglishLearningResult(chat, full);
        } else {
            result = makeConversationalKorean(result);
            renderKoreanResult(result);
        }
        lastTranslatedText = text;
        setStatus(
            chunks.length > 1
                ? "긴 문장 자동 번역 완료"
                : "자동 번역 완료"
        );
    } catch (error) {
        if (error?.name === "AbortError") {
            return;
        }

        if (requestId === translationRequestId) {
            clearOutput();
            setStatus(
                UI_TEXT[siteLanguage].error,
                true
            );
        }
    } finally {
        if (requestId === translationRequestId) {
            isTranslating = false;
            translationController = null;
        }
    }
}

/*

 *

function applySiteLanguage(language) {
    siteLanguage = language === "en" ? "en" : "ko";
    localStorage.setItem("translatorSiteLanguage", siteLanguage);
    const t = UI_TEXT[siteLanguage];

    siteTitle.innerHTML = t.title;
    siteSubtitle.textContent = t.subtitle;
    siteNote.textContent = t.note;
    resetButton.textContent = t.reset;
    inputLabel.textContent = t.input;
    input.placeholder = t.inputPlaceholder;
    outputLabel.textContent = t.output;
    output.placeholder = t.outputPlaceholder;
    copyInputText.textContent = t.copyInput;
    copyTextLabel.textContent = t.copyOutput;
    hintText.innerHTML = t.hint;
    tipText.textContent = t.tip;
    if (output.classList.contains("empty")) {
        const placeholder = output.querySelector(".output-placeholder");
        if (placeholder) placeholder.textContent = t.outputPlaceholder;
    }

    siteKoreanButton.classList.toggle("active", siteLanguage === "ko");
    siteEnglishButton.classList.toggle("active", siteLanguage === "en");
    siteKoreanButton.setAttribute("aria-pressed", String(siteLanguage === "ko"));
    siteEnglishButton.setAttribute("aria-pressed", String(siteLanguage === "en"));
}

siteKoreanButton.addEventListener("click", function() {
    applySiteLanguage("ko");
});

siteEnglishButton.addEventListener("click", function() {
    applySiteLanguage("en");
});

function resetAll() {
    // 진행 중인 번역 요청도 취소
    if (translationController) {
        translationController.abort();
        translationController = null;
    }
    translationRequestId++;
    isTranslating = false;

    // 예약된 자동 번역 취소
    if (translationTimer) {
        clearTimeout(translationTimer);
        translationTimer = null;
    }

    // 입력/결과 모두 초기화
    input.value = "";
    updateCounter();
    clearOutput();

    // 상태 및 번역 상태 초기화
    lastTranslatedText = "";
    setStatus("");

    // 입력창에 다시 커서
    input.focus();
}

resetButton.addEventListener("click", resetAll);

input.addEventListener("keydown", function(event) {
    if (event.isComposing) {
        return;
    }

    if (event.key === "Enter" && event.altKey) {
        event.preventDefault();

        const start = input.selectionStart;
        const end = input.selectionEnd;

        input.setRangeText(
            "\n",
            start,
            end,
            "end"
        );

        return;
    }

    if (
        event.key === "Enter" &&
        !event.altKey &&
        !event.shiftKey &&
        !event.ctrlKey &&
        !event.metaKey
    ) {
        event.preventDefault();
        clearTimeout(translationTimer);
        translationTimer = null;
        translate();
    }
});

async function copyText(text, successMessage, emptyMessage) {
    if (!text.trim()) {
        setStatus(emptyMessage, true);
        return;
    }

    try {
        await navigator.clipboard.writeText(text);
        setStatus(successMessage);
    } catch (error) {
        const temp = document.createElement("textarea");
        temp.value = text;
        temp.setAttribute("readonly", "");
        temp.style.position = "fixed";
        temp.style.opacity = "0";
        document.body.appendChild(temp);
        temp.focus();
        temp.select();
        try {
            const copied = document.execCommand("copy");
            if (!copied) throw new Error("copy failed");
            setStatus(successMessage);
        } catch (fallbackError) {
            setStatus(siteLanguage === "ko" ? "복사에 실패했어요. 직접 선택해서 복사해 주세요." : "Copy failed. Please select and copy the text manually.", true);
        } finally {
            temp.remove();
        }
    }
}

copyButton.addEventListener("click", function() {
    copyText(
        getOutputText(),
        UI_TEXT[siteLanguage].copyOutputDone,
        UI_TEXT[siteLanguage].copyOutputEmpty
    );
});

copyInput.addEventListener("click", function() {
    copyText(
        input.value,
        UI_TEXT[siteLanguage].copyInputDone,
        UI_TEXT[siteLanguage].copyInputEmpty
    );
});

input.addEventListener("input", function() {
    updateCounter();

    clearTimeout(translationTimer);
    translationTimer = null;

    // 입력이 바뀌었으므로 이전 문장을 새 번역 대상으로 취급합니다.
    lastTranslatedText = "";

    const text = input.value.trim();

    if (!text) {
        clearOutput();
        setStatus("");
        return;
    }

    // 입력이 바뀌면 진행 중인 이전 번역 요청도 즉시 취소해
    // 오래된 결과가 새 입력에 섞이지 않도록 해요.
    if (translationController) {
        translationController.abort();
        translationController = null;
        translationRequestId++;
        isTranslating = false;
    }

    // 입력을 멈춘 뒤 200ms 후 자동 번역
    translationTimer = setTimeout(function() {
        translationTimer = null;
        translate();
    }, AUTO_TRANSLATE_DELAY);
});
applySiteLanguage(siteLanguage);
updateCounter();
</script>
